[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "etas"
version = "0.1.0"
description = "Statistical Seismology and ETAS Forecasting Toolkit"
authors = [{ name = "Gauri Gupta" }]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "pyproj>=3.5",
    "obspy>=1.4",
    "matplotlib>=3.7",
    "requests>=2.28"
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "flake8>=6.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["etas*"]
